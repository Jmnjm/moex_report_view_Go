services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: moex_user
      POSTGRES_PASSWORD: moex_pass
      POSTGRES_DB: moex_reports
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moex_user -d moex_reports"]
      interval: 2s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://moex_user:moex_pass@db:5432/moex_reports?sslmode=disable
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports
      - ./styles:/app/styles

volumes:
  pgdata:
